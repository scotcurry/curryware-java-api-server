logging.level.org.curryware=DEBUG

spring.datasource.driver-class-name=org.postgresql.Driver

# Allow app to start even if database is unavailable
spring.datasource.hikari.initialization-fail-timeout=-1
# Best available players: the Cloud Function that lists a league's available players, and how
# long each league's list is cached before a background refresh (ISO-8601 duration).
curryware.available-players.url=https://us-central1-currywareff.cloudfunctions.net/available-players
curryware.available-players.cache-ttl=PT15M
